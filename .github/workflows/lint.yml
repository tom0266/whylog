name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck --severity=warning install.sh scripts/*.sh
      - name: python syntax
        run: python3 -m py_compile scripts/extract_sessions.py scripts/split_summary.py
