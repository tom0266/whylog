# whylog 설정 — 환경이 다르면 이 파일만 고치면 된다.
# daily.sh / rollup.sh 가 자기 폴더에서 이 파일을 읽는다.

# 일지에 기록할 작업 저장소 루트. 이 아래의 코드·문서 변경과 세션이 기록 대상이 된다.
TRACK_REPO="$HOME"

# 일지 저장소. 비워 두면 이 파일이 있는 폴더(clone 한 곳)에 쌓인다.
WORKLOG_DIR=""

# 요약 모델. 비용을 줄이려면 sonnet 으로 낮춰도 된다.
MODEL="opus"

# 일지 언어: ko(한국어) | en(English)
LANGUAGE="ko"

# claude 실행 파일. 비워 두면 PATH → ~/.local/bin/claude 순으로 자동 탐지한다.
CLAUDE_BIN=""

# 프롬프트에 실을 근거의 상한(자)
DIFF_BUDGET=60000        # 하루치 코드 diff 총량
DIFF_PER_FILE=6000       # 파일 하나가 예산을 독점하지 못하게 하는 상한
DIFF_MAX_FILES=40        # diff 본문을 실을 최대 파일 수
SESS_BUDGET=30000        # 세션 트랜스크립트에서 뽑은 근거 (한글은 1자=3바이트라 여유 필요)

# 기록에서 뺄 디렉터리 이름 조각. 경로에 이 문자열이 있는 세션·프롬프트는 기록하지 않는다.
SKIP_DIR=""

# 헤드리스 claude 응답 대기 상한(초)
TIMEOUT_SEC=600
