# whylog settings — if your setup differs, this is the only file to edit.
# daily.sh / rollup.sh read it from their own folder.

# Work folder to log. Code/doc changes and Claude Code sessions under it are recorded.
TRACK_REPO="$HOME"

# Log repo. Empty = this folder (where you cloned).
WORKLOG_DIR=""

# Summarizing model. Use sonnet to save usage.
MODEL="opus"

# Log language: ko (Korean) | en (English)
LANGUAGE="ko"

# claude executable. Empty = auto-detect (PATH, then ~/.local/bin/claude).
CLAUDE_BIN=""

# Caps on evidence in the prompt (characters)
DIFF_BUDGET=60000        # total code diff per day
DIFF_PER_FILE=6000       # per-file cap so one file can't eat the budget
DIFF_MAX_FILES=40        # max files with diff bodies
SESS_BUDGET=30000        # evidence extracted from session transcripts

# Sessions/prompts whose path contains this string are not logged.
SKIP_DIR=""

# Extra folders/files to keep out of the code diff: space-separated gitignore patterns,
# relative to TRACK_REPO. e.g. EXCLUDE="/datasets/ /experiments/*/outputs/"
# Patterns are added on every run; removing one here does not un-exclude it
# (delete that line from .snapshot.git/info/exclude as well).
EXCLUDE=""

# Timeout for the headless claude call (seconds)
TIMEOUT_SEC=600
